<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Pricing: Automation vs Manual Control</title>
  <desc id="desc">Abstract dashboard-like cover image with price curves and control cards.</desc>

  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1520" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B34"/>
      <stop offset="0.55" stop-color="#0B2D5B"/>
      <stop offset="1" stop-color="#0A1A2F"/>
    </linearGradient>
    <linearGradient id="panel" x1="300" y1="170" x2="1280" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D7E8FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#40D3A8"/>
      <stop offset="1" stop-color="#18A57F"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB85C"/>
      <stop offset="1" stop-color="#FF7D3B"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00172E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1320" cy="140" r="240" fill="#1BA6E7" fill-opacity="0.08"/>
  <circle cx="260" cy="760" r="280" fill="#42D8A2" fill-opacity="0.09"/>

  <g filter="url(#shadow)">
    <rect x="180" y="120" width="1240" height="660" rx="28" fill="url(#panel)" stroke="#9CC7FF" stroke-opacity="0.25"/>
  </g>

  <g opacity="0.55" stroke="#7AA9DC" stroke-opacity="0.35">
    <line x1="260" y1="220" x2="260" y2="700"/>
    <line x1="440" y1="220" x2="440" y2="700"/>
    <line x1="620" y1="220" x2="620" y2="700"/>
    <line x1="800" y1="220" x2="800" y2="700"/>
    <line x1="980" y1="220" x2="980" y2="700"/>
    <line x1="1160" y1="220" x2="1160" y2="700"/>
    <line x1="1340" y1="220" x2="1340" y2="700"/>
    <line x1="260" y1="220" x2="1340" y2="220"/>
    <line x1="260" y1="340" x2="1340" y2="340"/>
    <line x1="260" y1="460" x2="1340" y2="460"/>
    <line x1="260" y1="580" x2="1340" y2="580"/>
    <line x1="260" y1="700" x2="1340" y2="700"/>
  </g>

  <path d="M280 620 C380 560, 430 500, 520 520 C610 540, 700 420, 810 440 C920 460, 980 360, 1080 370 C1180 380, 1240 300, 1320 320" stroke="url(#lineA)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M280 650 C360 600, 460 640, 560 590 C660 540, 730 590, 830 530 C930 470, 1020 520, 1120 470 C1220 420, 1260 460, 1320 430" stroke="url(#lineB)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <g>
    <rect x="1060" y="170" width="290" height="150" rx="16" fill="#0E2546" stroke="#3E78B8" stroke-opacity="0.55"/>
    <text x="1090" y="215" fill="#D6E8FF" font-family="Arial, sans-serif" font-size="26" font-weight="700">Auto Rules</text>
    <text x="1090" y="252" fill="#9FC6EF" font-family="Arial, sans-serif" font-size="21">Margin floor: 28%</text>
    <text x="1090" y="282" fill="#9FC6EF" font-family="Arial, sans-serif" font-size="21">Max change: 5%</text>
  </g>

  <g>
    <rect x="1060" y="350" width="290" height="150" rx="16" fill="#132742" stroke="#4D87C5" stroke-opacity="0.55"/>
    <text x="1090" y="395" fill="#D6E8FF" font-family="Arial, sans-serif" font-size="26" font-weight="700">Manual Review</text>
    <text x="1090" y="432" fill="#9FC6EF" font-family="Arial, sans-serif" font-size="21">Hero SKUs</text>
    <text x="1090" y="462" fill="#9FC6EF" font-family="Arial, sans-serif" font-size="21">Campaign periods</text>
  </g>

  <text x="220" y="160" fill="#EAF3FF" font-family="Arial, sans-serif" font-size="56" font-weight="800">Dynamic Pricing in Ecommerce</text>
  <text x="220" y="208" fill="#A8C9EB" font-family="Arial, sans-serif" font-size="30" font-weight="500">When to Automate and When to Keep Manual Control</text>

  <rect x="220" y="730" width="370" height="44" rx="10" fill="#1B8FD0" fill-opacity="0.35"/>
  <text x="242" y="760" fill="#D8EEFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pricentrix Blog</text>
</svg>
